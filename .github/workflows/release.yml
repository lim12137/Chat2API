name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build target platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - windows
          - linux
      publish:
        description: 'Publish to GitHub Release'
        required: true
        default: false
        type: boolean

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Select build matrix by trigger/input
        id: set-matrix
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            MATRIX='{"include":[
              {"os":"macos-latest","arch":"arm64","platform":"macos"},
              {"os":"macos-latest","arch":"x64","platform":"macos"},
              {"os":"windows-latest","arch":"x64","platform":"windows"},
              {"os":"ubuntu-latest","arch":"x64","platform":"linux"},
              {"os":"ubuntu-latest","arch":"arm64","platform":"linux"}
            ]}'
          else
            case "${{ github.event.inputs.platform }}" in
              all)
                MATRIX='{"include":[
                  {"os":"macos-latest","arch":"arm64","platform":"macos"},
                  {"os":"macos-latest","arch":"x64","platform":"macos"},
                  {"os":"windows-latest","arch":"x64","platform":"windows"},
                  {"os":"ubuntu-latest","arch":"x64","platform":"linux"},
                  {"os":"ubuntu-latest","arch":"arm64","platform":"linux"}
                ]}'
                ;;
              macos)
                MATRIX='{"include":[
                  {"os":"macos-latest","arch":"arm64","platform":"macos"},
                  {"os":"macos-latest","arch":"x64","platform":"macos"}
                ]}'
                ;;
              windows)
                MATRIX='{"include":[
                  {"os":"windows-latest","arch":"x64","platform":"windows"}
                ]}'
                ;;
              linux)
                MATRIX='{"include":[
                  {"os":"ubuntu-latest","arch":"x64","platform":"linux"},
                  {"os":"ubuntu-latest","arch":"arm64","platform":"linux"}
                ]}'
                ;;
              *)
                echo "Unsupported platform input: ${{ github.event.inputs.platform }}"
                exit 1
                ;;
            esac
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare-matrix
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      actions: write

    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Run tests
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit((p.scripts && p.scripts.test) ? 0 : 1)"; then
            npm test
          else
            echo "No test script found in package.json, fallback to build-only validation."
          fi

      - name: Build application
        run: npm run build

      - name: Run check
        run: npm run prebuild:check

      - name: Build binary (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --${{ matrix.arch }} --publish=never
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Build binary (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --${{ matrix.arch }} --publish=never
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Build binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --${{ matrix.arch }} --publish=never
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chat2api-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/**
          if-no-files-found: error

      - name: Publish to GitHub Release (macOS)
        if: (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' && matrix.os == 'macos-latest')
        run: npx electron-builder --mac --${{ matrix.arch }} --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Publish to GitHub Release (Windows)
        if: (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' && matrix.os == 'windows-latest')
        run: npx electron-builder --win --${{ matrix.arch }} --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Publish to GitHub Release (Linux)
        if: (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' && matrix.os == 'ubuntu-latest')
        run: npx electron-builder --linux --${{ matrix.arch }} --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
